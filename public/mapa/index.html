<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Mapa samoprowadzenia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Raleway:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: jeden wygląd dla wszystkich. Granatowa scena z pytaniem u góry, pod nią jasne piaskowe tło z kartami. Jeden krok na ekran. */
:root{
  --stage:#0E192B; --stage-fg:#E4DCD1; --stage-muted:rgba(228,220,209,.68); --stage-line:rgba(228,220,209,.2); --stage-hover:rgba(228,220,209,.07);
  --opt-bg:transparent; --opt-hover-line:rgba(255,214,92,.6); --arrow:#FFD65C; --ray:rgba(228,220,209,.08);
  --bg:#F4F0EA; --surface:#FCFAF7; --fg:#17253F; --muted:rgba(23,37,63,.7); --accent:#133167; --line:rgba(19,49,103,.14);
  --quote-bg:rgba(19,49,103,.045);
  --gold:#FFD65C; --on-gold:#0E192B; --focus:#133167; color-scheme:light;
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
  --body:Raleway,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}

.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:680px;margin:0 auto}
.inner.wide{max-width:980px}

/* stage */
.stage{position:relative;overflow:hidden;background:var(--stage);color:var(--stage-fg);padding-block:48px 56px;border-bottom:1px solid var(--line)}
.stage::before{content:"";position:absolute;inset:-20% auto -20% 32%;width:220px;transform:rotate(18deg);background:linear-gradient(90deg,transparent,var(--ray) 50%,transparent);pointer-events:none}
.stage .inner{position:relative}
.stage :focus-visible{outline-color:var(--gold)}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px 4px;margin:0 0 22px;padding:0;list-style:none;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.crumbs li{display:flex;align-items:center;gap:4px;color:var(--stage-muted)}
.crumbs li+li::before{content:"›";opacity:.6;letter-spacing:0;margin-right:2px}
.crumbs button{background:none;border:0;padding:2px 0;color:var(--stage-muted);font-size:inherit;font-weight:inherit;letter-spacing:inherit;text-transform:inherit;text-decoration:underline;text-decoration-color:var(--stage-line);text-underline-offset:4px}
.crumbs button:hover{color:var(--stage-fg)}
.crumbs [aria-current]{color:var(--stage-fg)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.25em;text-transform:uppercase;color:var(--stage-muted);margin:0 0 14px}
h1{font-family:var(--display);font-weight:500;font-size:clamp(1.9rem,4.6vw,2.6rem);line-height:1.18;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1:focus{outline:none}
.lede{color:var(--stage-muted);font-weight:300;font-size:1.05rem;max-width:56ch;margin:16px 0 0}

.opts{display:grid;gap:10px;margin-top:34px}
.opt{display:grid;grid-template-columns:1fr auto;align-items:center;gap:16px;width:100%;text-align:left;background:var(--opt-bg);border:1px solid var(--stage-line);border-radius:3px;padding:18px 20px;color:var(--stage-fg);transition:background .2s,border-color .2s}
.opt:hover{background:var(--stage-hover);border-color:var(--opt-hover-line)}
.opt .l{font-family:var(--display);font-size:1.25rem;line-height:1.3;min-width:0}
.opt .s{display:block;font-family:var(--body);font-size:.88rem;font-weight:300;color:var(--stage-muted);margin-top:4px;line-height:1.5}
.opt.quote .l{font-family:var(--body);font-style:normal;font-size:1.05rem;line-height:1.5}
.opt .arr{font-family:var(--body);font-size:1.1rem;color:var(--arrow)}
.opts.two{grid-template-columns:1fr 1fr}
@media (max-width:560px){.opts.two{grid-template-columns:1fr}}

/* body */
.content{padding-block:40px 72px}
.stack{display:grid;gap:16px}
.label{font-size:11px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin:0 0 6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:24px 24px 22px}
.card .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);border:1px solid var(--line);border-radius:3px;padding:3px 8px;white-space:nowrap}
.card h2{font-family:var(--display);font-weight:500;font-size:1.45rem;line-height:1.25;margin:4px 0 10px;text-wrap:balance}
.card p{margin:0 0 10px;color:var(--fg);max-width:62ch}
.card p:last-child{margin-bottom:0}
.when{color:var(--muted);font-size:.95rem}
blockquote{margin:14px 0;padding:14px 18px;border-left:1.25px solid var(--accent);background:var(--quote-bg);font-family:var(--body);font-style:normal;font-size:1rem;line-height:1.55;color:var(--accent)}
.phrases{display:grid;gap:8px;margin:12px 0 0;padding:0;list-style:none}
.phrases li{font-family:var(--body);font-style:normal;font-size:1rem;color:var(--accent);padding:10px 16px;border-left:1.25px solid var(--accent);background:var(--quote-bg)}

.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:3px;padding:12px 22px;font-size:.95rem;font-weight:600;border:1px solid var(--line);background:transparent;color:var(--fg)}
.btn:hover{border-color:var(--accent)}
.btn.gold{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.btn.gold:hover{filter:brightness(.97)}
.inline-link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}


/* opcje i karty technik */
.options{display:grid;grid-template-columns:1fr;gap:16px;align-items:stretch}
@media (min-width:760px){.options.c2,.options.c4{grid-template-columns:repeat(2,minmax(0,1fr))}.options.c3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.option{display:flex;flex-direction:column;justify-content:flex-start;gap:2px;min-width:0;height:100%}
.option h2{margin-top:2px}
.techs{display:grid;gap:8px;margin-top:auto;padding-top:14px}
.tech{border:1px solid var(--line);border-radius:3px;background:var(--bg)}
.tech summary{display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;list-style:none;padding:12px 14px;font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.tech summary::-webkit-details-marker{display:none}
.tech summary:hover{background:var(--quote-bg)}
.tech .plus{position:relative;width:12px;height:12px;flex:none}
.tech .plus::before,.tech .plus::after{content:"";position:absolute;left:0;top:5.5px;width:12px;height:1.25px;background:var(--accent);transition:transform .2s}
.tech .plus::after{transform:rotate(90deg)}
.tech[open] .plus::after{transform:rotate(0)}
.tech dl{margin:0;padding:4px 14px 16px;display:grid;gap:12px}
.tech dt{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.tech dd{margin:0;font-size:.95rem;line-height:1.55}
@media (prefers-reduced-motion:reduce){.tech .plus::after{transition:none}}

/* skróty */
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:760px){.grid{grid-template-columns:repeat(3,1fr)}}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:14px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:20px;min-width:0;transition:border-color .2s,transform .2s}
.tile:hover{border-color:var(--accent);transform:translateY(-2px)}
.tile .l{font-family:var(--display);font-size:1.18rem;line-height:1.3;color:var(--fg)}
.tile .s{font-size:.85rem;color:var(--muted);font-weight:400}
.tile .go{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.side{display:flex;flex-wrap:wrap;gap:10px 24px;margin-top:28px;font-size:.95rem;color:var(--muted)}

.hint{display:flex;flex-wrap:nowrap;align-items:center;justify-content:space-between;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:20px 24px}
.hint p{margin:0;font-family:var(--display);font-size:1.2rem;flex:1 1 auto;min-width:0}
.hint .btn{flex:none;white-space:nowrap}
@media (max-width:480px){.hint{padding:16px}.hint p{font-size:1.05rem}.hint .btn{padding:10px 14px}}
.hint small{display:block;font-family:var(--body);font-size:.9rem;color:var(--muted);margin-top:2px}

main{animation:none}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.tile:hover{transform:none}}
</style>
</head>

      {n:"Tak Cię widzę, Dlaczego? lub Ja vs Mój cel",t:["widze","dlaczego","jacel"],b:["Na odkrycie i rozpuszczenie podświadomych blokad i przekonań."]},

const CAUSES=["sytuacja","natlok","niewiem","cel","schemat","watki","presja","nawyk","zlosc"];
N.przyczyna.opts=CAUSES.map(id=>({l:N[id].short,s:N[id].sub,to:id}));

const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const path=id=>{const p=[];let c=id;while(c){p.unshift(c);c=N[c].parent}return p};
function go(id){ if(location.hash.slice(1)===id) render(id); else location.hash=id; }

function crumbs(id){
  const p=path(id);
  if(p.length<2) return "";
  return `<ol class="crumbs" aria-label="Twoja ścieżka">${p.map((n,i)=>i===p.length-1
    ?`<li><span aria-current="step">${esc(N[n].crumb)}</span></li>`
    :`<li><button type="button" data-go="${n}">${esc(N[n].crumb)}</button></li>`).join("")}</ol>`;
}
function stage(inner,wide){return `<section class="stage wrap"><div class="inner${wide?" wide":""}">${inner}</div></section>`}
function actions(id){
  const parent=N[id]&&N[id].parent;
  return `<div class="actions">
    ${parent?`<button class="btn" type="button" data-go="${parent}">← Wróć</button>`:""}
    <button class="btn gold" type="button" data-go="start">Zacznij od nowa</button>
    <button class="inline-link" type="button" data-go="skroty">Skróty</button>
  </div>`;
}

function tiles(){
  return `<div class="grid">${CAUSES.map(id=>`<button class="tile" type="button" data-go="${id}">
      <span><span class="l">${esc(N[id].short)}</span>${N[id].sub?`<span class="s" style="display:block;margin-top:6px">${esc(N[id].sub)}</span>`:""}</span>
      <span class="go">Pokaż techniki →</span></button>`).join("")}</div>`;
}
function renderQ(id){
  const n=N[id];
  if(id==="przyczyna"){
    return stage(`${crumbs(id)}
      <p class="eyebrow">Pytanie</p>
      <h1 tabindex="-1">${esc(n.q)}</h1>`,true)
      +`<section class="content wrap"><div class="inner wide">${tiles()}${actions(id)}</div></section>`;
  }
  const opts=n.opts.map(o=>`<button class="opt${o.quote?" quote":""}" type="button" data-go="${o.to}">
      <span class="l">${esc(o.l)}${o.s?`<span class="s">${esc(o.s)}</span>`:""}</span><span class="arr" aria-hidden="true">→</span></button>`).join("");
  let html=stage(`${crumbs(id)}
    <p class="eyebrow">${id==="start"?"Mapa samoprowadzenia":"Pytanie"}</p>
    <h1 tabindex="-1">${esc(n.q)}</h1>
    ${n.lede?`<p class="lede">${esc(n.lede)}</p>`:""}
    <div class="opts${n.two?" two":""}">${opts}</div>`);
  if(id==="start"){
    html+=`<section class="content wrap"><div class="inner">
      <div class="hint"><p>Wybierz swój stan od razu,<br>bez przechodzenia przez pytania.</p>
      <button class="btn" type="button" data-go="skroty">Otwórz skróty →</button></div></div></section>`;
  } else {
    html+=`<section class="content wrap"><div class="inner">${actions(id)}</div></section>`;
  }
  return html;
}

function techCard(key,multi){
  const t=T[key];
  return `<details class="tech">
    <summary><span>Karta techniki${multi?`: ${esc(t.n)}`:""}</span><span class="plus" aria-hidden="true"></span></summary>
    <dl>
      <div><dt>Moduł</dt><dd>${esc(t.m)}</dd></div>
      <div><dt>Kiedy po nią sięgnąć</dt><dd>${esc(t.k)}</dd></div>
      <div><dt>Co robisz</dt><dd>${esc(t.c)}</dd></div>
      ${t.z?`<div><dt>Przydatne zwroty</dt><dd>${esc(t.z)}</dd></div>`:""}
      <div><dt>Cel</dt><dd>${esc(t.g)}</dd></div>
    </dl>
  </details>`;
}
function option(it,i,total){
  const name=it.n||T[it.t[0]].n;
  const body=(it.b||[]).map(p=>`<p>${esc(p)}</p>`).join("");
  const after=(it.after||[]).map(p=>`<p>${esc(p)}</p>`).join("");
  return `<article class="card option">
    <p class="label">${total>1?`Opcja ${i+1}`:"Technika"}</p>
    <h2>${esc(name)}</h2>
    ${it.w?`<p class="when">${esc(it.w)}</p>`:""}
    ${body}
    ${it.quote?`<blockquote>${esc(it.quote)}</blockquote>`:""}
    ${after}
    ${it.more?`<p><button class="inline-link" type="button" data-go="${it.more.to}">${esc(it.more.l)} →</button></p>`:""}
    <div class="techs">${it.t.map(k=>techCard(k,it.t.length>1)).join("")}</div>
  </article>`;
}
function renderR(id){
  const n=N[id];
  const count=n.items.length;
  const wide=count>1;
  let html=stage(`${crumbs(id)}
    <p class="eyebrow">Po co możesz sięgnąć</p>
    <h1 tabindex="-1">${esc(n.title)}</h1>
    ${n.lede?`<p class="lede">${esc(n.lede)}</p>`:""}`,wide);
  const phr=n.phrases?`<article class="card"><div class="top"><p class="label">Przydatne zwroty</p></div>
      <ul class="phrases">${n.phrases.map(p=>`<li>"${esc(p)}"</li>`).join("")}</ul></article>`:"";
  html+=`<section class="content wrap"><div class="inner${wide?" wide":""}">
    <div class="options c${count}">${n.items.map((it,i)=>option(it,i,count)).join("")}</div>
    ${phr?`<div class="stack" style="margin-top:16px">${phr}</div>`:""}
    ${actions(id)}</div></section>`;
  return html;
}
function renderShort(){
  const tiles=CAUSES.map(id=>`<button class="tile" type="button" data-go="${id}">
      <span><span class="l">${esc(N[id].short)}</span>${N[id].sub?`<span class="s" style="display:block;margin-top:6px">${esc(N[id].sub)}</span>`:""}</span>
      <span class="go">Pokaż techniki →</span></button>`).join("");
  return stage(`<p class="eyebrow">Skróty</p>
      <h1 tabindex="-1">Co spowodowało mój zły nastrój?</h1>`,true)
    +`<section class="content wrap"><div class="inner wide">
      <div class="grid">${tiles}</div>
      <div class="side"><button class="inline-link" type="button" data-go="dobry">Jestem w dobrym nastroju</button>
      <button class="inline-link" type="button" data-go="krotko">Nie mam teraz godziny</button>
      <button class="inline-link" type="button" data-go="start">Prowadź mnie od początku</button></div>
    </div></section>`;
}

let first=true;
function render(id){
  if(id!=="skroty"&&!N[id]) id="start";
  const html=id==="skroty"?renderShort():N[id].type==="q"?renderQ(id):renderR(id);
  app.innerHTML=`<div class="fade">${html}</div>`;
  try{localStorage.setItem("mapa-view",id==="skroty"?"skroty":"guide")}catch(e){}
  if(!first){window.scrollTo({top:0,behavior:"instant"});const h=app.querySelector("h1");if(h)h.focus({preventScroll:true})}
  first=false;
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-go]");
  if(t){go(t.dataset.go)}
});
window.addEventListener("hashchange",()=>render(location.hash.slice(1)||"start"));

let initial=location.hash.slice(1);
if(!initial){try{if(localStorage.getItem("mapa-view")==="skroty")initial="skroty"}catch(e){}}
render(initial||"start");
</script>

</body>
</html>
