    <!-- Canonical Enforcer Script to prevent fake subdomains or URL parameter spam in Google search results -->
    <script>
      (function() {
        try {
          var canonicalDomain = 'https://sandrafolta.pl/selfguidancespace';
          var canonicalElement = document.getElementById('canonical-url');
          if (canonicalElement) {
            var path = window.location.pathname;
            if (path === '/' || path === '/selfguidancespace' || path === '/selfguidancespace/') {
              canonicalElement.setAttribute('href', canonicalDomain);
            } else {
              canonicalElement.setAttribute('href', 'https://sandrafolta.pl' + path);
            }
          }
        } catch (e) {}
      })();
    </script>
